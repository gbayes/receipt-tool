services:
  - type: web
    name: receipt-merger
    env: docker
    region: oregon
    plan: free
    branch: main
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHONUNBUFFERED
        value: 1
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
    nginx:
      client_max_body_size: 6M 